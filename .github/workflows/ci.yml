name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sports_jobs
          POSTGRES_USER: sports
          POSTGRES_PASSWORD: sports
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sports -d sports_jobs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: sports_jobs
      POSTGRES_USER: sports
      POSTGRES_PASSWORD: sports
      INGESTION_MODE: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip install -e .
      - run: ruff check src tests orchestration
      - run: pytest -q
      - run: python -m sports_jobs.cli pipeline
