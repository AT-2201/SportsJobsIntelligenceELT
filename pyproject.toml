[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-jobs-elt"
version = "0.1.0"
description = "Production-style ELT pipeline for sports-industry job intelligence"
requires-python = ">=3.11"
dependencies = [
  "dbt-postgres==1.9.1",
  "prefect==3.8.5",
  "psycopg[binary]==3.2.10",
  "python-dotenv==1.2.3",
  "PyYAML==6.0.2",
  "requests==2.32.5",
  "tenacity==9.1.2",
]

[project.scripts]
sports-jobs = "sports_jobs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
