# Fixture mode is the default and requires no network access or credentials.
# In live mode, enabled Greenhouse/Lever entries are fetched from their public APIs.
sources:
  - name: portfolio_demo
    type: fixture
    path: data/fixtures/jobs.json
    enabled: true

  - name: hudl
    type: greenhouse
    board_token: hudl
    enabled: true

  - name: veo
    type: lever
    site: veo
    enabled: true
