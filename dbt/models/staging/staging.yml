version: 2

models:
  - name: stg_job_postings
    description: Latest known version of each source job posting with standardized values.
    columns:
      - name: job_id
        data_tests: [unique, not_null]
      - name: job_title
        data_tests: [not_null]
      - name: company_name
        data_tests: [not_null]
      - name: workplace_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["Remote", "Hybrid", "On-site", "Unknown"]
